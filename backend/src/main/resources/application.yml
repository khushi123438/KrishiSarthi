
server:
  port: ${PORT:8080}
  servlet:
    context-path: /

spring:
  application:
    name: krishisarthi-backend

  profiles:
    active: dev

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/farmlink}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 3000
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 25MB

  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USER:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

krishisarthi:
  app:
    name: "KrishiSarthi Agricultural Platform"
    version: "2.0.0"
    client-url: ${CLIENT_URL:http://localhost:5173}

  security:
    jwt-secret: ${SECRET_KEY}
    jwt-expiration-ms: 604800000
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:KrishiSarthi Admin}

  integrations:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.5-flash}

    razorpay:
      key-id: ${RAZORPAY_KEY_ID:}
      key-secret: ${RAZORPAY_KEY_SECRET:}

    weather:
      api-key: ${WEATHER_API_KEY:}

    sms:
      fast2sms-api-key: ${FAST2SMS_API_KEY:}
      twilio-sid: ${TWILIO_ACCOUNT_SID:}
      twilio-auth-token: ${TWILIO_AUTH_TOKEN:}
      twilio-phone: ${TWILIO_PHONE_NUMBER:}

  storage:
    upload-dir: ${UPLOAD_DIR:uploads}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
